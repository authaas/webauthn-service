syntax = "proto3";

package webauthn;

import "token/proof.proto";
import "webauthn/ceremony/assertion.proto";
import "webauthn/credential/id.proto";
import "webauthn/public_key_credential/request_options.proto";

message BeginLoginRequest {
  credential.ID credential = 1;
}

message BeginLoginResponse {
  public_key_credential.RequestOptions options = 1;
}

message FinishLoginRequest {
  ceremony.Assertion assertion = 1;
}

message FinishLoginResponse {
  token.Proof proof = 1;
}
