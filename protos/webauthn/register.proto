syntax = "proto3";

package webauthn;

import "identity/principal.proto";
import "identity/profile.proto";
import "token/proof.proto";
import "webauthn/ceremony/attestation.proto";
import "webauthn/public_key_credential/creation_options.proto";

message BeginRegisterRequest {
  identity.Profile profile = 1;
}

message BeginRegisterResponse {
  public_key_credential.CreationOptions options = 1;
}

message FinishRegisterRequest {
  identity.Principal principal = 1;
  identity.Profile profile = 2;
  ceremony.Attestation attestation = 3;
}

message FinishRegisterResponse {
  token.Proof proof = 1;
}
